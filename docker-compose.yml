services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: adhd-postgres
    environment:
      POSTGRES_DB: adhd_rag
      POSTGRES_USER: adhd
      POSTGRES_PASSWORD: dev_password_change_in_prod
      POSTGRES_HOST_AUTH_METHOD: trust  # For local dev only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./index/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adhd -d adhd_rag"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
