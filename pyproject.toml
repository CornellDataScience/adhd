[project]
name = "adhd"
version = "0.1.0"
description = "CDS RAG assistant: Mamba-3 vs. Transformer for code and codebase understanding"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "einops>=0.8",
    "huggingface-hub>=0.30",
    "torch==2.14.1",
    "transformers>=4.50",
]

[project.optional-dependencies]
# Official kernels; Linux + NVIDIA GPU only.
cuda = [
    "mamba-ssm; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mamba3"]

[tool.uv]

# Lets `uv lock` run on macOS without building mamba-ssm. Update when bumping the rev.
[[tool.uv.dependency-metadata]]
name = "mamba-ssm"
version = "2.3.2.post1"
requires-dist = [
    "torch",
    "tilelang==0.1.8",
    "apache-tvm-ffi<=0.1.12",
    "quack-kernels>=0.3.4",
    "triton>=3.5.0",
    "ninja",
    "einops",
    "transformers",
    "packaging",
    "setuptools>=61.0.0",
]

[tool.uv.extra-build-dependencies]
mamba-ssm = [{ requirement = "torch", match-runtime = true }]

[tool.uv.sources]
mamba-ssm = { git = "https://github.com/state-spaces/mamba", rev = "e9594ce1c732d97440f0332fdc43170a2294dbfa" }
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: downloads real checkpoints (run with `pytest -m slow`)"]
